name: Build TRAC RUN APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      HOME: /root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project resources
        run: godot --headless --path . --import || true

      - name: Create build folder
        run: mkdir -v -p build

      - name: Build APK
        run: godot --headless --path . --export-debug "Android" build/TRAC-RUN.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRAC-RUN-apk
          path: build/TRAC-RUN.apk
